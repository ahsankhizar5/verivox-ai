plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.verivox.app'
    compileSdk 34

    defaultConfig {
        applicationId "tech.verivox.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.1.0"
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
